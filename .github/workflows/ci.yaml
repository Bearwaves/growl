name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install \
          libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev libusb-1.0-0-dev
      - name: Configure CMake
        run: cmake -S . -B build -DGROWL_THIRDPARTY_LOGGING=1
        working-directory: example/test_app
      - name: Build
        run: make -j 4
        working-directory: example/test_app/build
      - name: Cache assets bundle
        id: cache-assets
        uses: actions/cache@v3
        with:
          path: example/test_app/assets.growl
          key: growl-assets-${{ hashFiles('example/test_app/assets') }}
      - name: Build assets
        if: ${{ steps.cache-assets.outputs.cache-hit != 'true' }}
        run: ./build/growl-cmd assets bundle ../assets
        working-directory: example/test_app


  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v11
        with:
          version: 3.1.70
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install libgl1-mesa-dev
      - name: Configure CMake
        run: emcmake cmake -S . -B build
        working-directory: example/test_app
      - name: Cache assets bundle
        uses: actions/cache@v3
        id: cache-assets
        with:
          path: example/test_app/assets.growl
          key: growl-assets-${{ hashFiles('example/assets') }}
      - name: Build assets
        if: ${{ steps.cache-assets.outputs.cache-hit != 'true' }}
        run: |
          cmake -S . -B build.linux && \
            cmake --build build.linux --parallel 4 && \
            ./build.linux/growl-cmd assets bundle ../assets
        working-directory: example/test_app
      - name: Build
        run: cp ../assets.growl . && make -j 4
        working-directory: example/test_app/build

  macOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Configure CMake
        run: cmake -S . -B build
        working-directory: example/test_app
      - name: Build
        run: make -j 4
        working-directory: example/test_app/build

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Configure CMake
        run: cmake -S . -B build
        working-directory: example/test_app
      - name: Build
        run: cmake --build . --parallel 4
        working-directory: example/test_app/build

  android:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle
      - name: Build
        run: ./scripts/gradle.sh assembleDebug
        working-directory: example/test_app

  iOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.0.1
      - name: Configure CMake
        run: |
          cmake -DCMAKE_SYSTEM_NAME="iOS" -GXcode \
            -S . -B build
        working-directory: example/test_app
      - name: Build
        run: |
          xcodebuild -project growl-test-app.xcodeproj -target "growl-test-app" \
            -configuration Debug -sdk iphoneos -parallelizeTargets \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build
        working-directory: example/test_app/build
